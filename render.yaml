# Render Blueprint with PostgreSQL (Paid Tier - $14/month)
# Use this for production with persistent data

databases:
  - name: ai-news-agent-db
    databaseName: newsagent
    user: newsagent
    plan: starter  # $7/month for persistent PostgreSQL

services:
  - type: web
    name: ai-news-agent
    env: python
    plan: starter  # $7/month for always-on service
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Required: LLM API Key (provide at least one)
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Required: Security
      - key: SECRET_KEY
        generateValue: true
      # Database (auto-connected from PostgreSQL above)
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-agent-db
          property: connectionString
      # Optional: Email notifications
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: notifications@ai-news-agent.com
      # Optional: Scheduler
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: DIGEST_GENERATION_TIME
        value: "00:00"
      # Optional: Observability
      - key: ARIZE_SPACE_ID
        sync: false
      - key: ARIZE_API_KEY
        sync: false

